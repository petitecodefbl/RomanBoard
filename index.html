<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mon Roman</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>Un été spécial</h1>
    <p>Mon espace d'écriture</p>
  </header>


  <nav>

    <button id="btn-dashboard">
      📊 Tableau de bord
    </button>

    <button id="btn-personnages">
      👤 Personnages
    </button>

    <button id="btn-relations">
      🕸️ Relations
    </button>

    <button id="btn-chronologie">
      🕐 Chronologie
    </button>

  </nav>


  <main>

    <!-- TABLEAU DE BORD -->

    <section id="dashboard">

      <h2>📊 Tableau de bord</h2>

      <h3>Objectif du roman</h3>

      <p>
        0 / 80 000 mots
      </p>

    </section>


    <!-- PERSONNAGES -->

    <section id="personnages">

      <h2>👤 Personnages</h2>

      <button id="ajouter-personnage">
        + Ajouter un personnage
      </button>

    </section>


    <!-- RELATIONS -->

    <section id="relations">

      <h2>🕸️ Relations</h2>

      <p>
        La carte des relations apparaîtra ici.
      </p>

    </section>


    <!-- CHRONOLOGIE -->

    <section id="chronologie">

      <h2>🕐 Chronologie</h2>

      <button id="ajouter-evenement">
        + Ajouter un événement
      </button>

    </section>

  </main>


  <script src="script.js"></script>

</body>

</html>
