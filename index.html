<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mon Roman</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>Un été spécial</h1>
    <p>Mon espace d'écriture</p>
  </header>


  <nav>

    <button id="btn-dashboard">
      📊 Tableau de bord
    </button>

    <button id="btn-personnages">
      👤 Personnages
    </button>

    <button id="btn-relations">
      🕸️ Relations
    </button>

    <button id="btn-chronologie">
      🕐 Chronologie
    </button>

  </nav>


  <main>

    <!-- TABLEAU DE BORD -->

    <section id="dashboard">

      <h2>📊 Tableau de bord</h2>

      <h3>Objectif du roman</h3>

      <p>
        0 / 80 000 mots
      </p>

    </section>


    <!-- PERSONNAGES -->

<section id="personnages">

  <h2>👤 Personnages</h2>

  <button id="ajouter-personnage">
    + Ajouter un personnage
  </button>

  <!-- FORMULAIRE -->

  <div id="formulaire-personnage">

    <h3>Nouveau personnage</h3>

    <label for="nom-personnage">Nom</label>
    <input
      type="text"
      id="nom-personnage"
      placeholder="Ex : Emma"
    >

    <label for="age-personnage">Âge</label>
    <input
      type="number"
      id="age-personnage"
      placeholder="Ex : 27"
    >

    <label for="genre-personnage">Genre</label>
    <select id="genre-personnage">
      <option value="">Non renseigné</option>
      <option value="Femme">Femme</option>
      <option value="Homme">Homme</option>
      <option value="Non-binaire">Non-binaire</option>
      <option value="Autre">Autre</option>
    </select>

    <label for="role-personnage">Rôle dans l'histoire</label>
    <input
      type="text"
      id="role-personnage"
      placeholder="Ex : Personnage principal"
    >

    <label for="apparence-personnage">Apparence</label>
    <textarea
      id="apparence-personnage"
      placeholder="Cheveux, yeux, vêtements, signes particuliers..."
    ></textarea>

    <label for="personnalite-personnage">Personnalité</label>
    <textarea
      id="personnalite-personnage"
      placeholder="Qualités, défauts, peurs, habitudes..."
    ></textarea>

    <label for="notes-personnage">Notes</label>
    <textarea
      id="notes-personnage"
      placeholder="Secrets, passé, idées..."
    ></textarea>

    <div class="actions-formulaire">
      <button id="enregistrer-personnage">
        💾 Enregistrer
      </button>

      <button id="annuler-personnage">
        Annuler
      </button>
    </div>

  </div>


<!-- LES PERSONNAGES APPARAÎTRONT ICI -->

<div id="liste-personnages"></div>

</section>


 <!-- RELATIONS -->

<section id="relations">

  <h2>🕸️ Relations</h2>

  <button id="ajouter-relation">
    + Ajouter une relation
  </button>


  <!-- FORMULAIRE RELATION -->

  <div id="formulaire-relation">

    <h3>Nouvelle relation</h3>

    <label for="personnage-1">
      Premier personnage
    </label>

    <select id="personnage-1"></select>


    <label for="type-relation">
      Type de relation
    </label>

    <select id="type-relation">

      <option value="❤️ Amour">
        ❤️ Amour
      </option>

      <option value="🤝 Amitié">
        🤝 Amitié
      </option>

      <option value="👨‍👩‍👧 Famille">
        👨‍👩‍👧 Famille
      </option>

      <option value="⚔️ Ennemi">
        ⚔️ Ennemi
      </option>

      <option value="💼 Collègue">
        💼 Collègue
      </option>

      <option value="❓ Autre">
        ❓ Autre
      </option>

    </select>


    <label for="personnage-2">
      Deuxième personnage
    </label>

    <select id="personnage-2"></select>


    <label for="description-relation">
      Détails
    </label>

    <textarea
      id="description-relation"
      placeholder="Ex : amis d'enfance, relation secrète..."
    ></textarea>


    <div class="actions-formulaire">

      <button id="enregistrer-relation">
        💾 Enregistrer
      </button>

      <button id="annuler-relation">
        Annuler
      </button>

    </div>

  </div>


  <!-- CARTE VISUELLE -->

  <h3 class="titre-carte">
    🕸️ Carte des relations
  </h3>

  <div id="carte-relations">

    <svg id="lignes-relations"></svg>

    <div id="bulles-personnages"></div>

  </div>


  <!-- RELATIONS ENREGISTRÉES -->

  <h3>
    📋 Relations enregistrées
  </h3>

  <div id="liste-relations"></div>

</section>

    <!-- CHRONOLOGIE -->

    <section id="chronologie">

      <h2>🕐 Chronologie</h2>

      <button id="ajouter-evenement">
        + Ajouter un événement
      </button>

    </section>

  </main>


  <script src="script.js"></script>

</body>

</html>
